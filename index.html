        .sentence {

        }

            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            display: inline-block;
            font-weight: normal;
            margin-top: 0.2rem;
        }
        .audio-btn:hover {
            background-color: #2980b9;
        }

        .hint {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            width: 80%;
            padding: 0.75rem;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;

            margin-bottom: 0.5rem;
        }

        button:hover {
            background-color: #007a2e;
        }

        .btn-secondary {
            background-color: #34495e;
        }
        .btn-secondary:hover {
            background-color: #2c3e50;
        }

        .btn-danger {
            background-color: #c0392b;
        }

        }

        .btn-warning {
            background-color: #e67e22;
        }
        .btn-warning:hover {

        .feedback {
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.05rem;
            min-height: 1.5rem;
            line-height: 1.4;
        }

        .correct {

        }

        .menu-container {
            display: flex;

            gap: 0.8rem;

        const modeNames = {
            present: "現在形",
            preterite: "完全過去形",
            imperfect: "不完全過去形",
            subjunctive: "接続法現在形"
        };

        let currentMode = null;

        function loadStatsForMode(mode) {
            try {
                let allStats = JSON.parse(localStorage.getItem('quizStatsByMode')) || {};
                if (!allStats[mode]) {
                    allStats[mode] = {};
                }
                return allStats[mode];
            } catch (e) {
                return {};
            }
        }

        function saveStatsForMode(mode, stats) {
            try {
                let allStats = JSON.parse(localStorage.getItem('quizStatsByMode')) || {};
                allStats[mode] = stats;
                localStorage.setItem('quizStatsByMode', JSON.stringify(allStats));
            } catch (e) {}
        }

        function resetAllStats() {
            if (confirm("すべてのモードの出題回数や誤答数をリセットして初期化しますか？")) {
                localStorage.removeItem('quizStatsByMode');
                alert("初期化しました。");
                showTopMenu();
            }
        }

        let currentQuizStats = {};
        let availableQuizes = [];
        let currentQuiz = {};
        let score = 0;
        let isWaitingForNext = false;
        let sessionWrongQuestions = []; 
        let allTimeWrongQuestions = []; 

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            return audioCtx;
        }

        function initAudioOnInteraction() {
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
                ctx.resume();
            }
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'incorrect') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.setValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {}
        }

        function playAudio() {
            if (!currentQuiz.sentence) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanAnswer = currentQuiz.answer.replace(/\s*\(.*\)/, '');
                const fullSentence = currentQuiz.sentence.replace('___', cleanAnswer);
                const utterance = new SpeechSynthesisUtterance(fullSentence);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function normalizeAccents(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        function getCompletedCountForMode(mode) {
            const stats = loadStatsForMode(mode);
            const total = quizDatabases[mode].length;
            let completed = 0;
            for (let id in stats) {
                if (stats[id].appeared > 0) {
                    completed++;
                }
            }
            if (completed > total) completed = total;
            return { completed, total };
        }

        function showTopMenu() {
            currentMode = null;
            const card = document.getElementById("app-card");
            
            let menuHtml = '';
            for (let modeKey in modeNames) {
                const { completed, total } = getCompletedCountForMode(modeKey);
                menuHtml += `<button onclick="startMode('${modeKey}')">${modeNames[modeKey]} <span style="font-size:0.85rem; opacity:0.85; font-weight:normal;">(${completed}/${total})</span></button>`;
            }

            card.innerHTML = `
                <h1>ブラジル・ポルトガル語 不規則動詞マスター</h1>
                <div class="subtitle">学習したい時制モードを選択してください</div>
                <div class="menu-container">
                    ${menuHtml}
                    <button onclick="resetAllStats()" class="btn-danger" style="margin-top: 1rem;">学習データをリセット・初期化</button>
                </div>
            `;
        }

        function startMode(mode) {
            initAudioOnInteraction();
            currentMode = mode;
            currentQuizStats = loadStatsForMode(mode);
            startNormalMode();
        }

        function getMasterData() {
            const baseData = quizDatabases[currentMode] || [];
            return baseData.map(q => {
                if (!currentQuizStats[q.id]) {
                    currentQuizStats[q.id] = { appeared: 0, incorrect: 0 };
                }
                return {
                    ...q,
                    appeared: currentQuizStats[q.id].appeared,
                    incorrect: currentQuizStats[q.id].incorrect
                };
            });
        }

        function startNormalMode() {
            initAudioOnInteraction();
            const master = getMasterData();
            
            const totalQuestionsInMode = quizDatabases[currentMode].length;
            let completedCount = 0;
            for (let id in currentQuizStats) {
                if (currentQuizStats[id].appeared > 0) {
                    completedCount++;
                }
            }

            if (completedCount >= totalQuestionsInMode) {
                for (let id in currentQuizStats) {
                    currentQuizStats[id].appeared = 0;
                }
                saveStatsForMode(currentMode, currentQuizStats);
            }

            const updatedMaster = getMasterData();
            updatedMaster.sort((a, b) => {
                if (a.appeared !== b.appeared) {
                    return a.appeared - b.appeared;
                }
                return Math.random() - 0.5;
            });

            availableQuizes = updatedMaster.slice(0, 10);
            setupGame("通常モード (未出題優先)");
        }

        function startWeaknessMode() {
            initAudioOnInteraction();
            const master = getMasterData();
            
            master.sort((a, b) => {
                const rateA = a.appeared > 0 ? (a.incorrect / a.appeared) : 0;
                const rateB = b.appeared > 0 ? (b.incorrect / b.appeared) : 0;

                // 第1優先：誤答割合が高い順 (rateB - rateA)
                if (rateB !== rateA) {
                    return rateB - rateA;
                }
                // 第2優先：誤答回数が多い順 (b.incorrect - a.incorrect)
                if (b.incorrect !== a.incorrect) {
                    return b.incorrect - a.incorrect;
                }
                // 第3優先（補助）：出題回数が少ない順
                return a.appeared - b.appeared;
            });

            const filtered = master.filter(q => q.incorrect > 0);
            if (filtered.length > 0) {
                availableQuizes = filtered.slice(0, 10);
            } else {
                availableQuizes = master.slice(0, 10);
            }

            setupGame("苦手特訓モード (誤答割合・回数優先)");
        }

        function updateProgressDisplay() {
            const remainingCount = document.getElementById("remaining-count");
            const scoreEl = document.getElementById("score");
            const totalProgressEl = document.getElementById("total-progress");

            if (remainingCount) remainingCount.textContent = availableQuizes.length;
            if (scoreEl) scoreEl.textContent = score;

            if (totalProgressEl && currentMode && quizDatabases[currentMode]) {
                const { completed, total } = getCompletedCountForMode(currentMode);
                totalProgressEl.textContent = `${total}問中 ${completed}問回答済み`;
            }
        }

        function setupGame(modeSubName) {
            score = 0;
            sessionWrongQuestions = [];
            allTimeWrongQuestions = [];
            isWaitingForNext = false;

            const card = document.getElementById("app-card");
            card.innerHTML = `
                <h1>${modeNames[currentMode]}</h1>
                <div class="subtitle" id="mode-subtitle">モード: ${modeSubName}</div>
                <div class="settings-box">
                    <label><input type="checkbox" id="auto-audio-toggle" ${isAutoAudioEnabled ? 'checked' : ''} onchange="toggleAudioSetting()"> 解答後に音声を自動再生する</label>
                </div>
                <div class="score">
                    残り問題数 (今回の10問): <span id="remaining-count">10</span> / 正解数: <span id="score">0</span><br>
                    全体進捗: <span id="total-progress">算出中...</span>
                </div>

                <div class="sentence-box" id="quiz-container">
                    <div class="sentence" id="sentence-display"></div>
                    <div class="hint" id="hint-display"></div>
                    <div class="translation" id="translation-display"></div>
                    <button class="audio-btn" onclick="playAudio()">🔊 例文の音声を聴く</button>
                </div>

                <div id="quiz-area">
                    <input type="text" id="user-answer" placeholder="空欄に入る活用を入力" autocomplete="off" autocapitalize="none" autocorrect="off">
                    <button id="submit-btn" onclick="handleAction()">回答する</button>
                </div>

                <div class="feedback" id="feedback"></div>
                <button onclick="showTopMenu()" id="back-to-top-btn" class="btn-secondary" style="margin-top: 1rem;">トップページに戻る</button>
            `;

            const inputField = document.getElementById("user-answer");
            if (inputField) {
                inputField.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        handleAction();
                    }
                });
            }

            nextQuestion();
        }

        function toggleAudioSetting() {
            const toggle = document.getElementById("auto-audio-toggle");
            if (toggle) {
                isAutoAudioEnabled = toggle.checked;
            }
        }

        function nextQuestion() {
            if (availableQuizes.length === 0) {
                if (sessionWrongQuestions.length > 0) {
                    availableQuizes = [...sessionWrongQuestions];
                    sessionWrongQuestions = [];
                } else {
                    showClearScreen();
                    return;
                }
            }

            isWaitingForNext = false;
            const submitBtn = document.getElementById("submit-btn");
            if (submitBtn) submitBtn.textContent = "回答する";

            const randomIndex = Math.floor(Math.random() * availableQuizes.length);
            currentQuiz = availableQuizes[randomIndex];

            if (!currentQuizStats[currentQuiz.id]) {
                currentQuizStats[currentQuiz.id] = { appeared: 0, incorrect: 0 };
            }
            currentQuizStats[currentQuiz.id].appeared++;
            saveStatsForMode(currentMode, currentQuizStats);

            updateProgressDisplay();

            const sentenceDisplay = document.getElementById("sentence-display");
            const hintDisplay = document.getElementById("hint-display");
            const translationDisplay = document.getElementById("translation-display");
            const userAnswer = document.getElementById("user-answer");
            const feedback = document.getElementById("feedback");

            if (sentenceDisplay) sentenceDisplay.textContent = currentQuiz.sentence;
            if (hintDisplay) hintDisplay.textContent = `ヒント: 動詞 [${currentQuiz.infinitive}] (${currentQuiz.person})`;
            if (translationDisplay) translationDisplay.textContent = `訳: ${currentQuiz.translation}`;
            if (userAnswer) {
                userAnswer.value = "";
                userAnswer.focus();
            }
            if (feedback) feedback.textContent = "";
        }

        function handleAction() {
            initAudioOnInteraction();
            if (isWaitingForNext) {
                const index = availableQuizes.indexOf(currentQuiz);
                if (index > -1) {
                    availableQuizes.splice(index, 1);
                }

                if (availableQuizes.length === 0 && sessionWrongQuestions.length === 0) {
                    showClearScreen();
                } else {
                    nextQuestion();
                }
                return;
            }

            const userAnswerEl = document.getElementById("user-answer");
            if (!userAnswerEl) return;

            const rawUserAnswer = userAnswerEl.value.trim().toLowerCase();
            const correctAnswer = currentQuiz.answer;
            const feedbackEl = document.getElementById("feedback");

            const normalizedUser = normalizeAccents(rawUserAnswer);
            const normalizedCorrect = normalizeAccents(correctAnswer);

            if (normalizedUser === normalizedCorrect) {
                playSound('correct');
                
                if (rawUserAnswer === correctAnswer) {
                    feedbackEl.textContent = "正解！ 🎉（次へ進むにはEnterまたはボタンを押してください）";
                } else {
                    feedbackEl.textContent = `正解です！ 🎉 （※ただし、本当は "${correctAnswer}" のようにアクセント記号が付きます）\n（次へ進むにはEnterまたはボタンを押してください）`;
                }
                feedbackEl.className = "feedback correct";
                score++;
                
                updateProgressDisplay();

                if (isAutoAudioEnabled) {
                    setTimeout(() => {
                        playAudio();
                    }, 300);
                }

                isWaitingForNext = true;
                const submitBtn = document.getElementById("submit-btn");
                if (submitBtn) submitBtn.textContent = "次へ進む";
                userAnswerEl.focus();

            } else {
                playSound('incorrect');
                feedbackEl.textContent = `不正解... 正解は "${correctAnswer}" です（次へ進むにはEnterまたはボタンを押してください）`;
                feedbackEl.className = "feedback incorrect";
                
                if (!currentQuizStats[currentQuiz.id]) {
                    currentQuizStats[currentQuiz.id] = { appeared: 0, incorrect: 0 };
                }
                currentQuizStats[currentQuiz.id].incorrect++;
                saveStatsForMode(currentMode, currentQuizStats);

                if (!sessionWrongQuestions.includes(currentQuiz)) {
                    sessionWrongQuestions.push(currentQuiz);
                }
                if (!allTimeWrongQuestions.includes(currentQuiz)) {
                    allTimeWrongQuestions.push(currentQuiz);
                }

                if (isAutoAudioEnabled) {
                    setTimeout(() => {
                        playAudio();
                    }, 300);
                }

                isWaitingForNext = true;
                const submitBtn = document.getElementById("submit-btn");
                if (submitBtn) submitBtn.textContent = "次へ進む";
                userAnswerEl.focus();
            }
        }

        function showClearScreen() {
            isWaitingForNext = false;
            const quizContainer = document.getElementById("quiz-container");
            const quizArea = document.getElementById("quiz-area");
            const remainingCount = document.getElementById("remaining-count");
            const scoreEl = document.getElementById("score");
            const feedbackEl = document.getElementById("feedback");
            const backToTopBtn = document.getElementById("back-to-top-btn");

            if (quizContainer) quizContainer.style.display = "none";
            if (quizArea) quizArea.style.display = "none";
            if (remainingCount) remainingCount.textContent = 0;
            if (scoreEl) scoreEl.textContent = score;
            if (backToTopBtn) backToTopBtn.style.display = "none";
            
            let htmlContent = `<div style="font-size: 1.2rem; margin-bottom: 1rem; color: #27ae60;">セッション終了！お疲れ様でした！🎉</div>`;
            
            if (allTimeWrongQuestions.length > 0) {
                htmlContent += `<button onclick="startReviewMode()" class="btn-secondary">今回間違えた問題 (${allTimeWrongQuestions.length}問) を復習する</button>`;
            }

            htmlContent += `<button onclick="startNormalMode()">未出題優先モードで次の10問に行く</button>`;
            htmlContent += `<button onclick="startWeaknessMode()" class="btn-danger">苦手特訓モードで10問挑戦する</button>`;
            htmlContent += `<button onclick="showTopMenu()" class="btn-warning" style="margin-top: 1rem;">トップページに戻る</button>`;

            if (feedbackEl) {
                feedbackEl.innerHTML = htmlContent;
                feedbackEl.className = "feedback";
            }
        }

        function startReviewMode() {
            initAudioOnInteraction();
            if (allTimeWrongQuestions.length === 0) return;
            availableQuizes = [...allTimeWrongQuestions];
            sessionWrongQuestions = [];
            allTimeWrongQuestions = [];
            score = 0;
            isWaitingForNext = false;
            
            const modeSubtitle = document.getElementById("mode-subtitle");
            const quizContainer = document.getElementById("quiz-container");
            const quizArea = document.getElementById("quiz-area");
            const submitBtn = document.getElementById("submit-btn");
            const backToTopBtn = document.getElementById("back-to-top-btn");

            if (modeSubtitle) modeSubtitle.textContent = "【復習モード】直近で間違えた問題";
            if (quizContainer) quizContainer.style.display = "block";
            if (quizArea) quizArea.style.display = "block";
            if (submitBtn) submitBtn.textContent = "回答する";
            if (backToTopBtn) backToTopBtn.style.display = "block";
            nextQuestion();
        }

        // 初期表示
        showTopMenu();
    </script>
